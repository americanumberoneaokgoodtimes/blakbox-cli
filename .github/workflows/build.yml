name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            artifact_name: blakbox-win-x64
            exe_name: blakbox.exe

          # Windows x86 (32-bit)
          - os: windows-latest
            arch: x86
            artifact_name: blakbox-win-x86
            exe_name: blakbox.exe

          # Linux x64
          - os: ubuntu-latest
            arch: x64
            artifact_name: blakbox-linux-x64
            exe_name: blakbox

          # Linux ARM64 (native arm64 runner; ubuntu-latest is x64)
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: blakbox-linux-arm64
            exe_name: blakbox

          # macOS x64 (Intel runner; macos-latest is Apple Silicon)
          - os: macos-13
            arch: x64
            artifact_name: blakbox-macos-x64
            exe_name: blakbox

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            artifact_name: blakbox-macos-arm64
            exe_name: blakbox

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg portaudio
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          src = open('audio_recorder.py', encoding='utf-8').read()
          version = re.search(r"^VERSION = '([^']+)'", src, re.M).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              sys.exit(f'Tag {tag} does not match VERSION {version}')

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --name blakbox audio_recorder.py --clean --noconfirm

      - name: Rename artifact
        run: |
          mv dist/blakbox* dist/${{ matrix.artifact_name }}${{ matrix.exe_name == 'blakbox.exe' && '.exe' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.exe_name == 'blakbox.exe' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true